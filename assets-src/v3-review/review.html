<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BugWorld · 实际资产审核</title>
<style>
:root{color-scheme:light;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#34302e;background:#f6f3ef}*{box-sizing:border-box}body{margin:0}header{padding:36px 5vw 24px;border-bottom:1px solid #e0d9d0;background:#fffdf9}.eyebrow{letter-spacing:.18em;font-size:12px;color:#78667f}h1{font-family:Georgia,"Microsoft YaHei",serif;font-size:34px;font-weight:500;margin:12px 0}p{line-height:1.8;color:#6a6263;max-width:980px;margin:8px 0}nav{padding:16px 5vw;position:sticky;top:0;background:#f6f3efee;backdrop-filter:blur(14px);z-index:3;display:flex;gap:9px;flex-wrap:wrap}button{font:inherit;border:1px solid #dcd4df;background:white;border-radius:24px;padding:10px 20px;color:#594763;cursor:pointer}button.active{background:#66516f;color:white;border-color:#66516f}main{padding:0 5vw 50px}.panel{display:none}.panel.active{display:block}.status{font-size:13px;background:#ede8f0;padding:13px 18px;border-radius:12px;margin:8px 0 22px;color:#66516f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}figure{margin:0;background:#fffdf9;border:1px solid #e3dcd4;border-radius:15px;overflow:hidden}img{display:block;width:100%;height:auto;background:white;cursor:zoom-in}figcaption{padding:14px 18px;font-size:13px;line-height:1.7}figcaption strong{display:block;color:#423942;font-size:15px;margin-bottom:3px}h2{font-weight:500;font-size:24px;margin:28px 0 15px}h3{font-size:17px;font-weight:500}a{color:#725a7d}a:focus,button:focus{outline:3px solid #bba6cb}.actions{display:flex;gap:20px;flex-wrap:wrap;padding:15px 0}details{margin:20px 0}summary{cursor:pointer;color:#66516f}dialog{border:0;border-radius:10px;padding:8px;max-width:96vw;max-height:96vh;background:#f7f3ed}dialog::backdrop{background:#17141bd9}dialog img{max-width:93vw;max-height:89vh;width:auto;object-fit:contain}dialog button{position:absolute;right:16px;top:16px}.wide{margin:20px 0}@media(max-width:900px){.grid{grid-template-columns:1fr}h1{font-size:27px}nav button{padding:8px 13px}}
</style>
<header><div class="eyebrow">BUGWORLD / ASSET REVIEW</div><h1>让画纸上的小生命，拥有真实的形体。</h1><p>本页展示可编辑资产与实际渲染，旁列已确认设计。点击图片可放大。这批资产已由用户确认并接入应用；本页仍是资产渲染，不代表 PICO 头显画质或性能验收。</p></header>
<nav id="nav"></nav><main id="main"></main><dialog id="zoom"><button onclick="document.getElementById('zoom').close()">关闭</button><img alt="放大预览" id="zoomimg"></dialog>
<script>
const items=[
 {id:'ui',name:'空间 UI 资产',ref:'../../docs/visual-redesign/2026-10-08/04-shared-space-multiwindow-v2.png',actual:'ui/boards/asset-layout-review.png',label:'交付 SVG 的实际排版',note:'品牌、工具图标、昆虫图标与画纸均来自本轮矢量文件。顶部按 TabBar 的依附关系示意；这张排版板不代表 SDK 窗口或交互已经实现。',extra:[['ui/boards/logo-and-tools-contact.png','品牌与十个工具图标 · 实际 SVG 栅格']],files:[['ui/README.md','UI 资产说明'],['ui/boards/asset-layout-review.svg','可编辑排版 SVG']]},
 {id:'lineart',name:'线稿与图标',ref:'../../docs/visual-redesign/2026-10-08/01-insect-sheets-v1.png',actual:'lineart/comparison-approved-vs-svg.png',label:'确认稿 / 实际 SVG 并排对照',note:'人工重绘的可编辑矢量路径。重点核对外轮廓、固定斑点、甲缝、足部连接和体节。',extra:[['lineart/icons-contact-sheet-actual-sizes.png','独立绘制的图标 · 48 / 64 / 96 像素'],['lineart/masks-contact-sheet.png','涂色区域遮罩检查']],files:[['lineart/README.md','线稿与图标说明']]},
 {id:'butterfly',name:'蝴蝶',ref:'../../docs/visual-redesign/2026-10-08/06-butterfly-3d-v1.png',actual:'butterfly/03-natural-leaf-closeup.png',label:'实际模型 · 自然环境观察',note:'检查宽阔前翅、圆润后翅、深色边缘与斑点；薄翅、胸腹、足与触角应具有真实体积。',extra:[['butterfly/01-neutral-three-quarter.png','中性光 · 实际模型'],['butterfly/02-shape-check.png','对应方向 · 轮廓检查'],['butterfly/04-glb-roundtrip.png','GLB 导回实际渲染'],['butterfly/05-exported-animation-contact-sheet.png','五种导出动画 · 关键姿态']],files:[['butterfly/butterfly.glb','下载 GLB'],['butterfly/butterfly.blend','Blender 源文件'],['butterfly/REVIEW.md','检查记录']]},
 {id:'beetle',name:'独角仙',ref:'../../docs/visual-redesign/2026-10-08/07-beetle-3d-v1.png',actual:'beetle/natural_setting.png',label:'实际模型 · 树皮近观',note:'检查长背甲、前上方弯曲的角和头甲；足部关节与深色腹面承托完整躯体。',extra:[['beetle/neutral_three_quarter.png','中性光 · 实际模型'],['beetle/roundtrip_neutral.png','GLB 导回实际渲染'],['beetle/animation_contact_sheet.png','展开与飞行姿态检查']],files:[['beetle/beetle.glb','下载 GLB'],['beetle/beetle.blend','Blender 源文件'],['beetle/REVIEW.md','检查记录']]},
 {id:'ladybug',name:'瓢虫',ref:'../../docs/visual-redesign/2026-10-08/08-ladybug-3d-v1.png',actual:'ladybug/natural_setting.png',label:'实际模型 · 叶面近观',note:'检查隆起的双甲片、中央甲缝、左右各一枚椭圆斑点；避免均匀塑料反光。',extra:[['ladybug/neutral_three_quarter.png','中性光 · 实际模型'],['ladybug/roundtrip_neutral.png','GLB 导回实际渲染'],['ladybug/animation_contact_sheet.png','展开与飞行姿态检查']],files:[['ladybug/ladybug.glb','下载 GLB'],['ladybug/ladybug.blend','Blender 源文件'],['ladybug/REVIEW.md','检查记录']]},
 {id:'caterpillar',name:'毛毛虫',ref:'../../docs/visual-redesign/2026-10-08/09-caterpillar-3d-v1.png',actual:'caterpillar/03-natural-leaf-closeup.png',label:'实际模型 · 叶面近观',note:'检查连续的软体表皮、节间褶皱、头部与腹足；伸缩时体节应保持连接。',extra:[['caterpillar/01-neutral-three-quarter.png','中性光 · 实际模型'],['caterpillar/02-shape-check.png','对应方向 · 轮廓检查'],['caterpillar/04-glb-roundtrip.png','GLB 导回实际渲染'],['caterpillar/05-exported-animation-contact-sheet.png','五种导出动画 · 关键姿态']],files:[['caterpillar/caterpillar.glb','下载 GLB'],['caterpillar/caterpillar.blend','Blender 源文件'],['caterpillar/REVIEW.md','检查记录']]},
 {id:'garden',name:'暮色荷塘',ref:'../../docs/visual-redesign/2026-10-08/03-stage-lotus-v1.png',actual:'garden/garden-populated.png',label:'实际 GLB · 场景与昆虫组合渲染',note:'叶片、树桩、枝条、苔藓、荷花与水面均来自实际几何；蝴蝶与瓢虫来自本轮独立 GLB。具体植物分布、树木轮廓及明暗层次仍与概念图有差异。世界环境、体积雾、光照反射和微光后期需要后续引擎实现，不能用本图替代头显验收。',extra:[['garden/garden-roundtrip.png','仅环境 GLB · 导回实际渲染']],files:[['garden/garden.glb','下载 GLB'],['garden/garden-naturalized.blend','Blender 场景'],['garden/REVIEW.md','场景检查与效果边界'],['garden/ASSET-SOURCES.md','资产来源与许可']]}
];
const fig=(src,title,desc='')=>`<figure><img src="${src}" alt="${title}" loading="lazy"><figcaption><strong>${title}</strong>${desc}</figcaption></figure>`;
for(const [i,item] of items.entries()){
 const b=document.createElement('button');b.textContent=item.name;b.dataset.id=item.id;if(!i)b.className='active';b.onclick=()=>{document.querySelectorAll('nav button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(item.id).classList.add('active');history.replaceState(null,'','#'+item.id)};document.getElementById('nav').append(b);
 const s=document.createElement('section');s.id=item.id;s.className='panel'+(!i?' active':'');s.innerHTML=`<div class="status">用户已确认 · 实际 GLB 已接入应用</div><p>${item.note}</p><div class="actions">${item.files.map(([p,n])=>`<a href="${p}">${n}</a>`).join('')}</div><div class="grid">${fig(item.ref,'已确认设计','概念参考，不是运行截图。')}${fig(item.actual,item.label,'由本轮资产生成。')}</div><h2>结构与导出检查</h2><div class="grid">${item.extra.map(([p,n])=>fig(p,n)).join('')}</div>`;document.getElementById('main').append(s);
}
document.addEventListener('click',e=>{if(e.target.tagName==='IMG'&&e.target.id!=='zoomimg'){document.getElementById('zoomimg').src=e.target.src;document.getElementById('zoom').showModal()}});
const h=location.hash.slice(1);if(h){document.querySelector(`button[data-id="${h}"]`)?.click()}
</script></html>
